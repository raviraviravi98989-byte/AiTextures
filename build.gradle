plugins {
    id 'java'
    id 'application'
}

group = 'com.aitextures'
version = '1.0.0'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    // Testing
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.aitextures.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}
